<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>PotionRH</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"/>
<style>
html,body{margin:0;height:100%;background:#3fcde6;background-image:radial-gradient(rgba(20,140,180,.25) 1px,transparent 1px);background-size:14px 14px;display:grid;place-items:center;overflow:hidden}
canvas#c{width:min(100vw,calc(100vh * 256 / 240));height:min(100vh,calc(100vw * 240 / 256));image-rendering:pixelated;image-rendering:crisp-edges;background:#bfe6ff;outline:none;touch-action:none;box-shadow:0 0 0 4px #fff,0 0 0 8px #f3a6c8,0 18px 40px rgba(160,80,130,.35)}
#gate{position:fixed;inset:0;display:grid;place-items:center;font-family:"Press Start 2P",monospace;z-index:7;overflow:hidden}
#gate.hide{display:none}
#bg{position:absolute;inset:0;width:100%;height:100%}
.card{position:relative;width:min(92vw,420px);background:#fff6fa;border:4px solid #f3a6c8;box-shadow:0 0 0 4px #fff,10px 10px 0 rgba(20,90,110,.35);padding:22px 24px 24px;text-align:center}
.card .potion{width:92px;height:auto;display:block;margin:-70px auto 4px;filter:drop-shadow(0 8px 10px rgba(20,60,80,.35));animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
.card h1{margin:0 0 6px;font-size:22px;color:#ec4f86;text-shadow:3px 3px 0 #fbd2e4;letter-spacing:1px}
.card .sub{margin:0 0 18px;font-size:9px;color:#b05a8a}
.card label{display:block;font-size:10px;color:#7a3e78;margin-bottom:10px;text-align:left}
.row{display:flex;gap:10px;align-items:stretch}
.row .at{font-size:14px;color:#ec4f86;background:#ffe4ee;border:3px solid #f3a6c8;display:grid;place-items:center;width:40px}
#nick,#evm,#refin{flex:1;min-width:0;font:inherit;font-size:12px;padding:12px 10px;color:#7a3e78;background:#fff;border:3px solid #f3a6c8;outline:none;text-transform:lowercase}
#evm{font-size:9px;text-transform:none}
#refin{text-transform:uppercase}
#nick:focus,#evm:focus,#refin:focus{border-color:#ec4f86;box-shadow:inset 0 0 0 2px #ffd6e8}
.step{display:none}.step.on{display:block;animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.who{font-size:9px;color:#b05a8a;margin:0 0 12px;text-align:left}
#back{margin-top:10px;background:none;border:0;font:inherit;font-size:8px;color:#b05a8a;cursor:pointer;text-decoration:underline}
#gate{background:#3fcde6}
#go{margin-top:16px;width:100%;font:inherit;font-size:12px;padding:14px 10px;cursor:pointer;color:#fff;background:#ffbe78;border:3px solid #c06a4a;box-shadow:inset 3px 3px 0 #ffe4b8,inset -3px -3px 0 #e89060,0 5px 0 #c06a4a;text-shadow:2px 2px 0 #c06a4a;transition:transform .08s,box-shadow .08s}
#go:hover{background:#ffd49a}
#go:active{transform:translateY(4px);box-shadow:inset 3px 3px 0 #ffe4b8,inset -3px -3px 0 #e89060,0 1px 0 #c06a4a}
#go:disabled{opacity:.6;cursor:wait}
#xGo{display:block;margin-top:16px;width:100%;box-sizing:border-box;text-align:center;text-decoration:none;font:inherit;font-size:12px;padding:14px 10px;cursor:pointer;color:#fff;background:#14171a;border:3px solid #000;box-shadow:0 5px 0 #000;text-shadow:2px 2px 0 #000}
#xGo:hover{background:#2a2f33}
#xGo:active{transform:translateY(4px);box-shadow:0 1px 0 #000}
.letter-card{width:min(92vw,520px)}
.letter-body{margin:0;min-height:8.2em;font-size:8px;line-height:2;color:#7a3e78;text-align:left}
.letter-nav{display:flex;align-items:center;justify-content:flex-end;gap:12px;margin-top:18px}
.letter-nav span{margin-right:auto;font-size:8px;color:#b05a8a}
#letterNext{width:72px;height:48px;font:inherit;font-size:16px;cursor:pointer;color:#fff;background:#ec4f86;border:3px solid #a8325d;box-shadow:0 4px 0 #a8325d}
#letterNext:active{transform:translateY(3px);box-shadow:0 1px 0 #a8325d}
#err{min-height:14px;margin-top:12px;font-size:8px;color:#d6336c;line-height:1.6}
#touch{display:none;position:fixed;inset:auto 0 0 0;justify-content:space-between;padding:0 12px 14px;pointer-events:none;z-index:4;font-family:"Press Start 2P",monospace}
#touch .pad{display:flex;gap:10px;pointer-events:auto}
#touch button{width:64px;height:64px;border-radius:50%;border:3px solid #c06a4a;background:rgba(255,190,120,.85);color:#fff;font:inherit;font-size:11px;text-shadow:2px 2px 0 #c06a4a;box-shadow:0 4px 0 #c06a4a;touch-action:none;user-select:none;-webkit-user-select:none}
#touch button:active{transform:translateY(3px);box-shadow:0 1px 0 #c06a4a}
@media (pointer:coarse){#touch{display:flex}}
#alBtn{position:fixed;top:10px;left:10px;z-index:4;font-family:"Press Start 2P",monospace;font-size:10px;padding:10px 12px;cursor:pointer;color:#fff;background:#21ce99;border:3px solid #137a5b;box-shadow:inset 2px 2px 0 #7af0c8,0 4px 0 #137a5b;text-shadow:2px 2px 0 #137a5b;transition:transform .08s}
#alBtn:active{transform:translateY(3px)}
.modal{position:fixed;inset:0;z-index:6;display:grid;place-items:center;background:rgba(10,70,90,.55);backdrop-filter:blur(6px);font-family:"Press Start 2P",monospace}
.modal.hide{display:none}
.modal .card{width:min(94vw,560px);max-height:90vh;overflow:auto;animation:pop .25s ease-out}
.modal h2{margin:0 0 14px;font-size:16px;color:#ec4f86;text-shadow:2px 2px 0 #fbd2e4}
.x-close{position:absolute;top:8px;right:10px;background:none;border:0;font:inherit;font-size:12px;color:#b05a8a;cursor:pointer}
.code{display:flex;gap:8px;align-items:center;justify-content:center;margin:0 0 16px}
.code b{font-size:16px;color:#7a3e78;background:#ffe4ee;border:3px dashed #f3a6c8;padding:10px 12px;letter-spacing:2px}
.mini{font:inherit;font-size:8px;padding:10px 8px;cursor:pointer;color:#fff;background:#ec4f86;border:3px solid #a8325d;box-shadow:0 3px 0 #a8325d}
.mini:active{transform:translateY(2px)}
.shares{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shares button{font:inherit;font-size:10px;padding:14px 8px;cursor:pointer;color:#fff;border:3px solid rgba(0,0,0,.35);box-shadow:0 4px 0 rgba(0,0,0,.3);transition:transform .08s}
.shares button:hover{transform:translateY(-2px)}
.shares button:active{transform:translateY(2px)}
.s-x{background:#14171a}.s-ig{background:#d6336c}.s-dc{background:#5865f2}.s-wa{background:#25d366}
.note{min-height:12px;margin-top:12px;font-size:8px;color:#137a5b;line-height:1.6}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;text-align:left}
@media (max-width:520px){.cols{grid-template-columns:1fr}}
.cols h3{font-size:9px;color:#7a3e78;margin:0 0 8px;border-bottom:3px solid #f3a6c8;padding-bottom:6px}
.cols ol{list-style:none;margin:0;padding:0}
.cols li{display:flex;align-items:center;gap:6px;font-size:8px;color:#7a3e78;padding:6px 0;border-bottom:1px dashed #f8cfe0}
.cols li img{width:18px;height:18px;border:2px solid #fff;box-shadow:0 0 0 1px #f3a6c8;background:#ffe4ee}
.cols li .n{color:#ec4f86;width:16px}
.cols li .pt{margin-left:auto;color:#21ce99}
.cols li .rc{display:block;color:#b05a8a;font-size:7px;margin-top:3px}
.mine{margin-top:14px;font-size:8px;color:#7a3e78;line-height:1.8}
</style>
</head>
<body>
<div id="gate" class="hide" data-testid="name-gate">
  <canvas id="bg"></canvas>
  <form class="card" id="gateForm">
    <img class="potion" src="/assets/potion.png" alt="PotionRH potion"/>
    <h1>POTIONRH</h1>
    <p class="sub">PINK DREAM 1-1</p>
    <div class="step on" id="stepNick" data-testid="step-nick">
      <label for="nick">1/3 YOUR X USERNAME</label>
      <div class="row">
        <span class="at">@</span>
        <input id="nick" data-testid="nick-input" maxlength="12" autocomplete="off" spellcheck="false" placeholder="username"/>
      </div>
    </div>
    <div class="step" id="stepEvm" data-testid="step-evm">
      <p class="who" id="who" data-testid="evm-step-nick"></p>
      <label for="evm">2/3 YOUR EVM ADDRESS</label>
      <div class="row">
        <input id="evm" data-testid="evm-input" maxlength="42" autocomplete="off" spellcheck="false" placeholder="0x..."/>
      </div>
    </div>
    <div class="step" id="stepRef" data-testid="step-ref">
      <label for="refin">3/3 REF CODE? (OPTIONAL)</label>
      <div class="row">
        <input id="refin" data-testid="ref-input" maxlength="8" autocomplete="off" spellcheck="false" placeholder="PRH12345"/>
      </div>
    </div>
    <button id="go" type="submit" data-testid="nick-submit">NEXT</button>
    <button id="back" type="button" class="step" data-testid="evm-back">&#9664; CHANGE USERNAME</button>
    <div id="err" data-testid="nick-error"></div>
  </form>
</div>
<button id="alBtn" type="button" data-testid="allowlist-button">ALLOW LIST</button>
<div id="alModal" class="modal hide" data-testid="allowlist-modal">
  <div class="card">
    <button class="x-close" type="button" data-close data-testid="allowlist-close">X</button>
    <h2>ALLOW LIST</h2>
    <div class="cols">
      <div><h3>LATEST 10</h3><ol id="alLatest" data-testid="allowlist-latest"></ol></div>
      <div><h3>TOP REF CODES</h3><ol id="alTop" data-testid="allowlist-top"></ol></div>
    </div>
    <div class="mine" id="alMine" data-testid="allowlist-mine"></div>
  </div>
</div>
<div id="xModal" class="modal hide" data-testid="x-open-modal">
  <div class="card">
    <button class="x-close" type="button" data-close data-testid="x-open-close">X</button>
    <h2 id="xTitle">OPEN X</h2>
    <p class="sub">TAP TO OPEN IT IN A NEW TAB</p>
    <a id="xGo" href="https://x.com" target="_blank" rel="noopener" data-testid="x-open-link">OPEN X</a>
  </div>
</div>
<div id="letterModal" class="modal hide" data-testid="whitelist-letter">
  <div class="card letter-card">
    <h2>WHITELIST</h2>
    <p class="letter-body" id="letterBody" data-testid="whitelist-letter-body"></p>
    <div class="letter-nav">
      <span id="letterCount">1 / 3</span>
      <button id="letterNext" type="button" data-testid="whitelist-letter-next" aria-label="Next page">&#9654;</button>
    </div>
  </div>
</div>
<div id="invModal" class="modal hide" data-testid="invite-modal">
  <div class="card">
    <button class="x-close" type="button" data-close data-testid="invite-close">X</button>
    <h2>INVITE FRIENDS</h2>
    <p class="sub">+10 POINTS FOR EVERY FRIEND</p>
    <div class="code"><b id="invCode" data-testid="invite-ref-code">PRH-----</b><button class="mini" type="button" id="copyCode" data-testid="invite-copy-code">COPY</button></div>
    <div class="shares">
      <button class="s-x" type="button" data-share="x" data-testid="invite-share-x">X</button>
      <button class="s-ig" type="button" data-share="ig" data-testid="invite-share-instagram">INSTAGRAM</button>
      <button class="s-dc" type="button" data-share="dc" data-testid="invite-share-discord">DISCORD</button>
      <button class="s-wa" type="button" data-share="wa" data-testid="invite-share-whatsapp">WHATSAPP</button>
    </div>
    <div class="note" id="invNote" data-testid="invite-note"></div>
  </div>
</div>
<canvas id="c" width="1024" height="960" tabindex="0"></canvas>
<div id="touch" data-testid="touch-controls">
  <div class="pad"><button data-k="ArrowLeft" data-testid="touch-left">&#9664;</button><button data-k="ArrowRight" data-testid="touch-right">&#9654;</button></div>
  <div class="pad"><button data-k="KeyX" data-testid="touch-run">RUN</button><button data-k="Space" data-testid="touch-jump">JUMP</button></div>
</div>
<script>
/* PotionRH - original code, tiles and sounds. */
const T = 16, ROWS = 15, VIEW_W = 256, VIEW_H = 240, SCALE = 4;
const AIR=0, GND=1, BRK=2, USED=4, OBS=6, QFOLLOW=11, QRT=12, QLIKE=13, QSHARE=14;
const QUEST_TILES = { [QFOLLOW]:"follow", [QRT]:"rt", [QLIKE]:"like", [QSHARE]:"share" };
const QUESTS = [
  { kind:"follow", tile:QFOLLOW, tx:16, ty:9, label:"FOLLOW X" },
  { kind:"rt", tile:QRT, tx:21, ty:9, label:"RT" },
  { kind:"like", tile:QLIKE, tx:23, ty:9, label:"LIKE" },
  { kind:"share", tile:QSHARE, tx:22, ty:5, label:"SHARE" }
];
const LEVEL_W = 33;
const PORTAL = { x:27, top:8, w:4, h:5 };
const c = document.getElementById("c");
const ctx = c.getContext("2d");
ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
ctx.imageSmoothingEnabled = false;

const PAL = {
  K:"#3a2340", S:"#ffd9c4", W:"#ffffff", Y:"#ffe27a",
  N:"#8e4a26", n:"#5c2c12", V:"#86cc52", v:"#4f8f2d", U:"#6a3a1c",
  B:"#5a6fe8", b:"#3c4ab8", A:"#21ce99", R:"#ec4f86"
};
const hsh = (a, b, c) => {
  let n = Math.imul(a, 374761393) + Math.imul(b, 668265263) + Math.imul(c || 0, 2246822519);
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return (n ^ (n >>> 16)) >>> 0;
};

const FONT = {
  " ":"000000000000000",
  "0":"111101101101111","1":"010010010010010","2":"111001111100111","3":"111001111001111",
  "4":"101101111001001","5":"111100111001111","6":"111100111101111","7":"111001001001001",
  "8":"111101111101111","9":"111101111001111",
  "A":"111101111101101","B":"110101110101110","C":"111100100100111","D":"110101101101110",
  "E":"111100111100111","F":"111100111100100","G":"111100101101111","H":"101101111101101",
  "I":"111010010010111","J":"001001001101111","K":"101101110101101","L":"100100100100111",
  "M":"101111101101101","N":"110101101101101","O":"111101101101111","P":"111101111100100",
  "Q":"111101101111001","R":"111101110101101","S":"111100111001111","T":"111010010010010",
  "U":"101101101101111","V":"101101101101010","W":"101101101111101","X":"101101010101101",
  "Y":"101101010010010","Z":"111001010100111",
  "-":"000000111000000","x":"000101010101000","_":"000000000000111",".":"000000000000010","/":"001001010100100"
};

const API = new URLSearchParams(location.search).get("api") || "";
let nick = localStorage.getItem("potionrh_nick") || "";
let avatar = null;
const potionImg = new Image();
potionImg.src = "/assets/potion.png";
function loadAvatar(url) {
  avatar = null;
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.onload = () => { avatar = img; };
  img.src = url;
}
const hudNick = () => nick.toUpperCase().replace(/[^A-Z0-9_]/g, ".");
const progress = { follow:false, rt:false, like:false, share:false };
try { Object.assign(progress, JSON.parse(localStorage.getItem("potionrh_progress") || "{}")); } catch (err) { /* ignore */ }
const links = {
  follow_url:"https://x.com/potionrh", rt_url:"https://x.com/potionrh", like_url:"https://x.com/potionrh",
  share_url:"https://x.com/potionrh", share_text:"Grabbing my potion at PotionRH"
};
const doneCount = () => Object.values(progress).filter(Boolean).length;

const held = new Set();
const edge = new Set();
function pressKey(code) { if (!held.has(code)) edge.add(code); held.add(code); }
addEventListener("keydown", (e) => {
  if (e.target && e.target.tagName === "INPUT") return;
  pressKey(e.code);
  if (["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault();
});
addEventListener("keyup", (e) => held.delete(e.code));
addEventListener("blur", () => { held.clear(); edge.clear(); });
for (const btn of document.querySelectorAll("#touch button")) {
  const code = btn.dataset.k;
  btn.addEventListener("pointerdown", (e) => { e.preventDefault(); btn.setPointerCapture(e.pointerId); pressKey(code); audio(); });
  for (const ev of ["pointerup","pointercancel","lostpointercapture"]) btn.addEventListener(ev, () => held.delete(code));
  btn.addEventListener("contextmenu", (e) => e.preventDefault());
}

const press = (codes) => codes.some((k) => edge.has(k));
const hold = (codes) => codes.some((k) => held.has(k));
const JUMP = ["Space","KeyZ","ArrowUp","KeyW"];
const RUN = ["KeyX","ShiftLeft","ShiftRight"];
const LEFT = ["ArrowLeft","KeyA"];
const RIGHT = ["ArrowRight","KeyD"];
const DOWN = ["ArrowDown","KeyS"];

let actx = null, muted = false;
function audio() {
  if (!actx) actx = new AudioContext();
  if (actx.state === "suspended") actx.resume();
  return actx;
}
function tone(freq, dur, type, vol, to) {
  if (muted) return;
  try {
    const a = audio();
    const o = a.createOscillator();
    const g = a.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, a.currentTime);
    if (to) o.frequency.exponentialRampToValueAtTime(Math.max(40, to), a.currentTime + dur);
    g.gain.setValueAtTime(vol || 0.04, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination);
    o.start();
    o.stop(a.currentTime + dur + 0.02);
  } catch (err) { /* audio optional */ }
}
const sfx = {
  jump: () => tone(620, 0.12, "square", 0.05, 220),
  bump: () => tone(140, 0.06, "square", 0.04),
  power: () => { [523,659,784,1046].forEach((f,i) => setTimeout(() => tone(f, 0.1, "square", 0.05), i * 70)); },
  die: () => { [520,440,349,262,196].forEach((f,i) => setTimeout(() => tone(f, 0.16, "square", 0.05), i * 90)); },
  portal: () => tone(180, 0.18, "square", 0.04, 80)
};

const SMALL_TOP = [
  "....KKKKKK......","...KNNNNNNK.....","..KNnNNNNNNK....","..KNNNNnNNNNK...",
  "..KNNSSSSSNNK...","..KNSSSWKSSK....","...KSSSSSSK.....","....KSSSSK......",
  "....KVAAVK......","...KVBVVBVK.....","...KSKBYBKS.....","...KK.KBBBKK...."
];
const SMALL = {
  hand: { R:10, L:4, row:10 },
  stand: [...SMALL_TOP, "......KBBBBK....","......KBBKBBK...","......KUUKUUK...",".......KK.KK...."],
  walk: [...SMALL_TOP, "......KBBBBK....",".....KBBBKBBBK..","....KUUK..KUUK..","....KKK...KKK..."],
  jump: [...SMALL_TOP, ".....KKBBBBKK...","....KUUKBBKUUK..","....KKK.KK.KKK..","................"]
};
const BIG_TOP = [
  "....KKKKKK......","...KNNNNNNK.....","..KNnNNNNNNK....","..KNNNNnNNNNK...",
  "..KNNNNNNNNNK...","..KNNSSSSSNNK...","..KNSSSWKSSNK...","..KNSSSSSSSK....",
  "...KSSSSSSK.....","....KSSSSK......","....KVAAVK......","...KVBVVBVK.....",
  "..KVVBVVBVVK....","..KVKBBBBBKVK...","..KVKBYBYBKVK...","..KSKBBBBBKSK...",
  "..KK.KBBBBKK....",".....KBBBBK.....",".....KBBBBK.....",".....KBBBBK....."
];
const BIG = {
  hand: { R:11, L:3, row:15 },
  stand: [...BIG_TOP, ".....KBBKBBK....",".....KBBKBBK....",".....KBBKBBK....",".....KUUKUUK....",".....KUUKUUK....","......KK.KK....."],
  walk: [...BIG_TOP, "....KBBBKBBBK...","....KBBK.KBBK...","...KUUK...KUUK..","...KKK.....KKK.."],
  jump: [...BIG_TOP, "....KKBBBBKK....","...KUUKBBKUUK...","...KKK.KK.KKK..."]
};
const ICONS = {
  follow: ["1100000011","1110000111","0111001110","0011111100","0001111000","0001111000","0011111100","0111001110","1110000111","1100000011"],
  rt: ["0010000000","0111000000","1111111100","0010000100","0010000100","0010000100","0010000100","0011111111","0000000111","0000000010"],
  like: ["0110001100","1111011110","1111111111","1111111111","1111111111","0111111110","0011111100","0001111000","0000110000","0000000000"],
  share: ["0000000110","0000011110","0001111110","1111111110","1111111110","1111111110","0001111110","0011011110","0011000110","0011000000"]
};

let grid, COLS;
let bumps = new Map();
let fx = [];
let cam = 0;
let tick = 0;
let lives = 3;
let state = nick ? "load" : "name";
let cardT = 0, deadT = 0, pause = false;
let outfit = "blue", hasPotion = false, hasPaper = false, growPending = false;
const mario = { x:48, y:192, w:12, h:16, vx:0, vy:0, dir:1, onGround:true, power:"small", inv:0, crouch:false };

function at(tx, ty) {
  if (ty < 0 || ty >= ROWS) return AIR;
  if (tx < 0 || tx >= COLS) return GND;
  return grid[ty * COLS + tx];
}
function put(tx, ty, v) {
  if (ty < 0 || ty >= ROWS || tx < 0 || tx >= COLS) return;
  grid[ty * COLS + tx] = v;
}
function solid(tx, ty) { return at(tx, ty) !== AIR; }
function hits(x, y, w, h) {
  const x0 = Math.floor(x / T), x1 = Math.floor((x + w - 0.001) / T);
  const y0 = Math.floor(y / T), y1 = Math.floor((y + h - 0.001) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (solid(tx, ty)) return true;
  return false;
}

function buildLevel() {

  bumps = new Map();

  for (const [vx, vy] of specs) fx.push({ kind:"bit", x:tx*T+4, y:ty*T+4, vx, vy, t:28 });

function bump(tx, ty) {
  const t = at(tx, ty);
  const key = tx + "," + ty;
  if (!bumps.has(key)) bumps.set(key, { o:0, v:-3.2 });
  if (t === BRK) {

function moveBody(ent) {
  const grounded = ent.onGround;
  ent.onGround = false;
  ent.x += ent.vx;
  if (hits(ent.x, ent.y, ent.w, ent.h)) {
    let stepped = false;
    if (grounded) {
      for (let s = 1; s <= 16; s++) {
        if (!hits(ent.x, ent.y - s, ent.w, ent.h)) { ent.y -= s; stepped = true; break; }
      }
    }
    if (!stepped) {
      if (ent.vx > 0) ent.x = Math.floor((ent.x + ent.w - 0.001) / T) * T - ent.w;
      else if (ent.vx < 0) ent.x = (Math.floor(ent.x / T) + 1) * T;
      ent.vx = 0;

  ent.y += ent.vy;
  if (hits(ent.x, ent.y, ent.w, ent.h)) {
    if (ent.vy > 0) {

      ent.vy = 0;
      ent.onGround = true;
    } else if (ent.vy < 0) {
      ent.y = (Math.floor(ent.y / T) + 1) * T;
      ent.vy = 0;
      bonk();
    } else {
      ent.y = Math.floor((ent.y + ent.h - 0.001) / T) * T - ent.h;
      ent.onGround = true;
    }
  }
}

function questUrl(kind) {

function isMobile() {
  const ua = navigator.userAgent || "";
  return /Android|iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}
function xAction(url) {
  try {
    const u = new URL(url);
    if (!/(^|\.)(x|twitter)\.com$/i.test(u.hostname)) return null;
    const p = u.pathname.split("/").filter(Boolean);
    const statusAt = p.indexOf("status");
    if (statusAt >= 0 && /^\d+$/.test(p[statusAt + 1] || "")) return { kind:"status", id:p[statusAt + 1] };
    if (p[0] === "intent") {
      const text = u.searchParams.get("text") || "";
      const tweetId = u.searchParams.get("tweet_id") || "";
      const name = (u.searchParams.get("screen_name") || "").replace(/^@/, "");
      if (p[1] === "post" || p[1] === "tweet") return { kind:"post", text };
      if (/^\d+$/.test(tweetId)) return { kind:"status", id:tweetId };
      if (name) return { kind:"user", name };
    }
    if (p.length === 1 && !/^(home|explore|search|i|share|messages|settings|compose)$/i.test(p[0])) {
      return { kind:"user", name:p[0].replace(/^@/, "") };
    }
    return { kind:"app" };
  } catch (err) { return null; }
}
function iosXUrl(action) {
  if (action.kind === "status") return "twitter://status?id=" + encodeURIComponent(action.id);
  if (action.kind === "post") return "twitter://post?message=" + encodeURIComponent(action.text);
  if (action.kind === "user") return "twitter://user?screen_name=" + encodeURIComponent(action.name);

}

function insideXApp() {
  const ua = navigator.userAgent || "";
  if (/Twitter/i.test(ua) || /\bwv\b/.test(ua)) return true;
  try {
    return /(^|\.)(x\.com|twitter\.com|t\.co)$/i.test(new URL(document.referrer).hostname);
  } catch (err) { return false; }
}
function openX(url, label) {
  if (!isMobile()) { showXCard(url, label); return; }
  if (insideXApp()) {
    try { (window.top || window).location.href = url; }
    catch (err) { window.location.href = url; }
    return;
  }
  let href = url;
  if (/Android/i.test(navigator.userAgent)) {
    try {
      const u = new URL(url);
      if (/(^|\.)(x|twitter)\.com$/i.test(u.hostname)) {
        href = "intent://" + u.host + u.pathname + u.search + "#Intent;scheme=https;package=com.twitter.android;end";

  } else {
    const action = xAction(url);

function updateMario() {
  if (mario.inv > 0) mario.inv--;
  const run = hold(RUN);
  const left = hold(LEFT), right = hold(RIGHT);
  if (press(JUMP) && mario.onGround) {
    mario.vy = run ? -8.55 : -7.85;
    mario.onGround = false;
    sfx.jump();
  }
  if (!hold(JUMP) && mario.vy < -3.5) mario.vy = -3.5;
  if (mario.power !== "small" && hold(DOWN) && mario.onGround) {
    if (!mario.crouch) { mario.crouch = true; mario.h = 16; mario.y += 16; }
  } else if (mario.crouch && !hits(mario.x, mario.y - 16, mario.w, 32)) {
    mario.crouch = false; mario.y -= 16; mario.h = 32;
  }
  if (!mario.crouch) {
    const max = run ? 2.45 : 1.28;
    const acc = (mario.onGround ? 1 : 0.85) * (run ? 0.12 : 0.075);
    if (left && !right) { mario.vx -= acc; mario.dir = -1; }
    else if (right && !left) { mario.vx += acc; mario.dir = 1; }
    else if (mario.onGround) mario.vx *= 0.78;
    if (mario.onGround && ((left && mario.vx > 0.4) || (right && mario.vx < -0.4))) mario.vx += left ? -0.22 : 0.22;
    if (mario.vx > max) mario.vx = max;
    if (mario.vx < -max) mario.vx = -max;
  } else mario.vx *= 0.6;
  if (Math.abs(mario.vx) < 0.06) mario.vx = 0;
  mario.vy += 0.33;
  if (mario.vy > 4.8) mario.vy = 4.8;
  moveBody(mario);
  if (growPending && mario.onGround && mario.power === "small" && !hits(mario.x, mario.y - 16, mario.w, 32)) {
    growTo("big"); growPending = false; mario.inv = 20;
  }
  const maxCam = COLS * T - VIEW_W;
  cam = Math.max(0, Math.min(maxCam, Math.round(mario.x + mario.w / 2 - VIEW_W / 2)));
  if (mario.y > 250) die();
}

function update() {
  tick++;
  if (press(["KeyM"])) muted = !muted;
  if (press(["Escape"]) && state === "play") pause = !pause;
  if (pause) { edge.clear(); return; }
  if (modalOpen()) { edge.clear(); held.clear(); return; }
  for (const [k, b] of bumps) {
    b.o += b.v; b.v += 0.45;
    if (b.o >= 0) bumps.delete(k);
  }
  for (const f of fx) {
    f.t--;
    if (f.kind === "pop") f.y -= 0.45;
    if (f.kind === "bit" || f.kind === "spark") { f.x += f.vx; f.y += f.vy; f.vy += f.kind === "bit" ? 0.35 : 0.08; }
    if (f.kind === "smoke") { f.x += f.vx; f.y += f.vy; f.vx *= 0.97; f.r += 0.09; }
  }
  for (let i = fx.length - 1; i >= 0; i--) if (fx[i].t <= 0) fx.splice(i, 1);

  if (state === "name" || state === "load") { edge.clear(); return; }
  if (state === "card") {
    cardT++;
    if (cardT > 150 || press(["Enter","Space"])) { state = "play"; cardT = 0; }
  } else if (state === "play") {
    updateMario();
    updateDino();
  } else if (state === "dead") {
    deadT++;
    mario.vy += 0.28;
    mario.y += mario.vy;
    if (deadT > 110) {
      lives--;
      if (lives > 0) { buildLevel(); state = "card"; cardT = 0; }
      else state = "over";
    }
  } else if (state === "over") {
    if (press(["Enter","Space"])) { lives = 3; buildLevel(); state = "card"; cardT = 0; }
  }
  edge.clear();
}

function glyphs(str, x, y, color) {

}

  for (let r = 0; r < h; r++) {

function showGate(evmFor) {
  gate.classList.remove("hide"); requestAnimationFrame(drawGateBg);
  if (evmFor) { pendingNick = evmFor; nickInput.value = evmFor; document.getElementById("who").textContent = "@" + evmFor.toUpperCase(); }
  setStep(evmFor ? 1 : 0);
}
backBtn.addEventListener("click", () => setStep(step - 1));
function openGame(player) {
  nick = player.nick; me = player;
  localStorage.setItem("potionrh_nick", nick);
  localStorage.setItem("potionrh_avatar", player.avatar_url);
  loadAvatar(player.avatar_url);
  if (player.progress) for (const k of Object.keys(progress)) progress[k] = progress[k] || !!player.progress[k];
  localStorage.setItem("potionrh_progress", JSON.stringify(progress));
  gate.classList.add("hide");
  buildLevel();
  state = "card"; cardT = 0;
  c.focus();
}
async function checkNick(raw) {
  const clean = raw.trim().replace(/^@+/, "");
  if (!/^[A-Za-z0-9_]{2,12}$/.test(clean)) { errBox.textContent = "2-12 CHARS: LETTERS, DIGITS, _"; return; }
  errBox.textContent = "";
  goBtn.disabled = true;
  try {
    const res = await fetch(API + "/api/players/" + encodeURIComponent(clean));
    if (res.ok) { errBox.textContent = "USERNAME ALREADY REGISTERED"; return; }
    if (res.status !== 404) { errBox.textContent = "COULD NOT CHECK, TRY AGAIN"; return; }
    showGate(clean);
  } catch (err) {
    errBox.textContent = "COULD NOT CHECK, TRY AGAIN";
  } finally {
    goBtn.disabled = false;
  }
}
async function checkEvm(raw) {
  const evm = raw.trim();
  if (!/^0x[a-fA-F0-9]{40}$/.test(evm)) { errBox.textContent = "ENTER A VALID 0x ADDRESS (42 CHARS)"; return; }
  errBox.textContent = "";
  goBtn.disabled = true;
  try {
    const res = await fetch(API + "/api/wallets/" + encodeURIComponent(evm));
    if (res.ok) { errBox.textContent = "WALLET ALREADY REGISTERED"; return; }
    if (res.status !== 404) { errBox.textContent = "COULD NOT CHECK, TRY AGAIN"; return; }
    setStep(2);
  } catch (err) {
    errBox.textContent = "COULD NOT CHECK, TRY AGAIN";
  } finally {
    goBtn.disabled = false;
  }
}
async function registerPlayer() {
  const ref = refInput.value.trim().toUpperCase();
  if (ref && !/^PRH\d{5}$/.test(ref)) { errBox.textContent = "CODE LOOKS LIKE PRH12345"; return; }
  errBox.textContent = "";
  goBtn.disabled = true; goBtn.textContent = "SAVING...";
  try {
    const body = { nick: pendingNick, evm_address: evmInput.value.trim() };
    if (ref) body.referral_code = ref;
    const res = await fetch(API + "/api/players", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (res.status === 422 || res.status === 409) { const d = await res.json(); errBox.textContent = String(d.detail || "INVALID").toUpperCase(); return; }
    if (!res.ok) throw new Error("bad status " + res.status);
    openGame(await res.json());
  } catch (err) {
    errBox.textContent = "COULD NOT SAVE, TRY AGAIN";
  } finally {
    goBtn.disabled = false; goBtn.textContent = "START";
  }
}
document.getElementById("gateForm").addEventListener("submit", (e) => {
  e.preventDefault();
  if (step === 0) checkNick(nickInput.value);
  else if (step === 1) checkEvm(evmInput.value);
  else registerPlayer();
});

/* ---- invite + allow list ---- */
const invModal = document.getElementById("invModal"), alModal = document.getElementById("alModal"), xModal = document.getElementById("xModal");
const invNote = document.getElementById("invNote");
const letterModal = document.getElementById("letterModal");
const modalOpen = () => !invModal.classList.contains("hide") || !alModal.classList.contains("hide") || !xModal.classList.contains("hide") || !letterModal.classList.contains("hide");
const inviteLink = () => location.origin + "/?ref=" + me.ref_code;
const inviteMsg = () => "Join me on PotionRH and grab your potion! Use my ref code " + me.ref_code + " " + inviteLink();
function closeModals() { invModal.classList.add("hide"); alModal.classList.add("hide"); xModal.classList.add("hide"); c.focus(); }
for (const m of [invModal, alModal, xModal]) m.addEventListener("click", (e) => { if (e.target === m || e.target.hasAttribute("data-close")) closeModals(); });
document.getElementById("xGo").addEventListener("click", () => { xModal.classList.add("hide"); c.focus(); });
document.getElementById("letterNext").addEventListener("click", nextLetter);
addEventListener("keydown", (e) => {
  if (letterModal.classList.contains("hide")) return;
  if (e.code === "ArrowRight" || e.code === "Enter" || e.code === "Space") { e.preventDefault(); e.stopImmediatePropagation(); nextLetter(); }
}, true);
addEventListener("keydown", (e) => { if (e.code === "Escape" && modalOpen()) { e.stopImmediatePropagation(); closeModals(); letterModal.classList.add("hide"); c.focus(); } }, true);
function openInvite() {
  if (!me || !me.ref_code) return;
  held.clear();
  document.getElementById("invCode").textContent = me.ref_code;
  invNote.textContent = "";
  invModal.classList.remove("hide");
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (err) {
    const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy"); ta.remove(); return ok;
  }
}
document.getElementById("copyCode").addEventListener("click", async () => {
  invNote.textContent = (await copyText(me.ref_code)) ? "CODE COPIED" : "COPY FAILED";
});
for (const b of document.querySelectorAll("[data-share]")) b.addEventListener("click", async () => {
  const kind = b.dataset.share, msg = inviteMsg();
  if (kind === "x") {
    const url = "https://x.com/intent/post?text=" + encodeURIComponent(msg);
    if (isMobile()) openX(url);
    else window.open(url, "_blank", "noopener");
    return;
  }
  if (kind === "wa") { window.open("https://wa.me/?text=" + encodeURIComponent(msg), "_blank", "noopener"); return; }
  const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  if (mobile && navigator.share) { try { await navigator.share({ text: msg }); return; } catch (err) { /* fall back to copy */ } }
  await copyText(msg);
  invNote.textContent = "INVITE COPIED - PASTE IT IN " + (kind === "ig" ? "INSTAGRAM" : "DISCORD");
  window.open(kind === "ig" ? "https://www.instagram.com/direct/inbox/" : "https://discord.com/channels/@me", "_blank", "noopener");
});
const esc = (t) => String(t).replace(/[&<>"']/g, (ch) => "&#" + ch.charCodeAt(0) + ";");
function row(i, p, extra) {
  return '<li><span class="n">' + (i + 1) + '</span><img src="' + esc(p.avatar_url) + '" alt="" loading="lazy"/><span>@' + esc(p.nick) + (extra || "") + "</span>";
}
async function openAllowList() {
  held.clear();
  alModal.classList.remove("hide");
  const latest = document.getElementById("alLatest"), top = document.getElementById("alTop");
  latest.innerHTML = top.innerHTML = "<li>LOADING...</li>";
  document.getElementById("alMine").innerHTML = me && me.ref_code ? "YOUR CODE: <b>" + esc(me.ref_code) + "</b> &middot; " + me.points + " PTS" : "";
  try {
    const res = await fetch(API + "/api/allowlist");
    const d = await res.json();
    latest.innerHTML = d.latest.map((p, i) => row(i, p) + "</li>").join("") || "<li>NO PLAYERS YET</li>";
    top.innerHTML = d.leaders.map((p, i) => row(i, p, '<span class="rc">' + esc(p.ref_code) + "</span>") + '<span class="pt">' + p.points + " PTS</span></li>").join("") || "<li>NO INVITES YET</li>";
  } catch (err) { latest.innerHTML = top.innerHTML = "<li>COULD NOT LOAD</li>"; }
}
document.getElementById("alBtn").addEventListener("click", openAllowList);

async function boot() {
  try {
    const res = await fetch(API + "/api/settings");
    if (res.ok) Object.assign(links, await res.json());
  } catch (err) { /* defaults */ }
  if (!nick) { buildLevel(); showGate(); return; }
  loadAvatar(localStorage.getItem("potionrh_avatar") || ("https://unavatar.io/x/" + nick.toLowerCase()));
  try {
    const res = await fetch(API + "/api/players", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ nick }) });
    if (res.ok) {
      const p = await res.json();
      me = p;
      for (const k of Object.keys(progress)) progress[k] = progress[k] || !!p.progress[k];
      localStorage.setItem("potionrh_progress", JSON.stringify(progress));
      if (!p.evm_address) { buildLevel(); showGate(p.nick); return; }
    }
  } catch (err) { /* offline: keep local progress */ }
  buildLevel();
  state = "card"; cardT = 0;
  c.focus();
}
buildLevel();
boot();
addEventListener("pointerdown", (e) => { if (e.target === c) { c.focus(); if (hitDino(e)) openInvite(); } audio(); });
requestAnimationFrame(frame);
</script>
