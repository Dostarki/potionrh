<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="PotionRH" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <title>PotionRH</title>
        <script>
            (function () {
                if (window.top !== window) return;
                var ua = navigator.userAgent || "";
                var mobile = /Android|iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
                if (!mobile) return;
                var url;
                try { url = new URL(location.href); } catch (e) { return; }
                if (url.searchParams.get("out") === "1") {
                    url.searchParams.delete("out");
                    try { history.replaceState(null, "", url.pathname + url.search + url.hash); } catch (err) {}
                    return;
                }
                var ref = "";
                try { ref = document.referrer || ""; } catch (e) {}
                var host = "";
                try { host = new URL(ref).hostname; } catch (e) {}
                var inX = /Twitter/i.test(ua) || /(^|\.)(t\.co|x\.com|twitter\.com)$/i.test(host) || /^android-app:\/\/com\.(twitter|x\.)/i.test(ref);
                if (!inX) return;
                if (/CriOS|FxiOS|EdgiOS|OPiOS|SamsungBrowser/i.test(ua)) return;
                if (/Android/i.test(ua) && /Chrome\/\d/i.test(ua) && !/\bwv\b/.test(ua) && !/Twitter/i.test(ua)) return;
                url.searchParams.set("out", "1");
                var https = url.origin + url.pathname + url.search;
                if (/Android/i.test(ua)) {
                    location.replace("intent://" + url.host + url.pathname + url.search + "#Intent;scheme=https;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;S.browser_fallback_url=" + encodeURIComponent(https) + ";end");
                    return;
                }
                var safari = https.replace(/^https:/i, "x-safari-https:").replace(/^http:/i, "x-safari-http:");
                document.documentElement.classList.add("x-out");
                var style = document.createElement("style");
                style.textContent = "html.x-out,html.x-out body{background:#3fcde6}html.x-out #root{display:none!important}#open-browser{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#3fcde6;text-decoration:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}#open-browser span{color:#fff;background:#14171a;font:700 14px/1.6 sans-serif;padding:18px 16px;border:3px solid #000;box-shadow:0 5px 0 #000;pointer-events:none}";
                document.documentElement.appendChild(style);
                function mount() {
                    if (document.getElementById("open-browser")) return;
                    var link = document.createElement("a");
                    link.id = "open-browser";
                    link.href = safari;
                    var label = document.createElement("span");
                    label.textContent = "OPEN IN BROWSER";
                    link.appendChild(label);
                    document.body.appendChild(link);
                }
                if (document.body) mount();
                else document.addEventListener("DOMContentLoaded", mount);
                location.replace(safari);
            })();
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
