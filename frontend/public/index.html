<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="PotionRH" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <title>PotionRH</title>
        <script>
            (function () {
                var ua = navigator.userAgent || "";
                if (!/Twitter/i.test(ua)) return;
                var href = location.href;
                if (/Android/i.test(ua)) {
                    var path = href.replace(/^https?:\/\//, "");
                    location.replace("intent://" + path + "#Intent;scheme=https;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;S.browser_fallback_url=" + encodeURIComponent(href) + ";end");
                    return;
                }
                var safari = href.replace(/^https:/i, "x-safari-https:").replace(/^http:/i, "x-safari-http:");
                var style = document.createElement("style");
                style.textContent = "#root{display:none!important}#open-browser{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;padding:24px;background:#3fcde6;text-align:center;-webkit-tap-highlight-color:transparent;touch-action:manipulation}#open-browser span{display:inline-block;max-width:280px;color:#fff;background:#14171a;font:700 14px/1.6 sans-serif;padding:18px 16px;border:3px solid #000;box-shadow:0 5px 0 #000;pointer-events:none}";
                document.documentElement.appendChild(style);
                function mount() {
                    var root = document.getElementById("root");
                    if (root) root.style.display = "none";
                    var link = document.createElement("a");
                    link.id = "open-browser";
                    link.href = safari;
                    var label = document.createElement("span");
                    label.textContent = "OPEN IN BROWSER";
                    link.appendChild(label);
                    link.addEventListener("click", function () {
                        location.href = safari;
                    });
                    document.body.appendChild(link);
                }
                if (document.body) mount();
                else document.addEventListener("DOMContentLoaded", mount);
            })();
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
