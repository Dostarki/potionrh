[project]
name = "potionrh"
version = "1.0.0"
description = "PotionRH game, player API, and admin"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141.1",
  "uvicorn>=0.32.0",
  "motor==3.7.1",
  "pymongo==4.18.2",
  "pyjwt>=2.10.1",
  "pydantic>=2.6.4",
  "python-dotenv>=1.0.1",
]

[tool.vercel]
entrypoint = "backend.server:app"

[tool.vercel.fastapi.static]
cdn = true
exclude = true
